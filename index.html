<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0d0c; color: #f1ebe0; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: min(560px, 100% - 40px); padding: 40px 0; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { color: #a39b8d; margin: 0 0 32px; }
    a { display: block; padding: 22px 24px; border: 1px solid #2b2723; border-radius: 14px; color: inherit; text-decoration: none; transition: border-color .25s, transform .25s; }
    a:hover { border-color: #c9a24b; transform: translateY(-2px); }
    b { display: block; font-size: 1.15rem; }
    span { color: #a39b8d; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio</h1>
    <p>Демо-проєкти</p>
    <a href="barbershop/"><b>RAZOR &amp; CO.</b><span>Барбершоп · лендінг з онлайн-записом</span></a>
  </main>
</body>
</html>
